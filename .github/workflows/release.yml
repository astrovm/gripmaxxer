name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the selected branch (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Build code never runs with signing secrets or repository write access.
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vX.Y.Z"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          newest="$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n1)"
          if [[ "$TAG" == "$latest" || "$newest" != "$TAG" ]]; then
            echo "::error::Release tag must be newer than $latest"
            exit 1
          fi
          if (( $(git rev-list --count HEAD) <= $(git rev-list --count "refs/tags/$latest") )); then
            echo "::error::A release must contain new commits so the Android version code increases"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; push it to trigger a release instead"
              exit 1
            fi
            # Gradle derives the version from Git. Only the publish job pushes the tag.
            git tag "$TAG"
          elif ! git tag --points-at HEAD | grep -qxF "$TAG"; then
            echo "::error::Tag does not point at the commit being built"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:ci

      - name: Verify version metadata
        run: |
          actual="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          code="$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)"
          if [[ "$actual" != "${TAG#v}" || "$code" != "$(git rev-list --count HEAD)" ]]; then
            echo "::error::APK version does not match the release commit and tag"
            exit 1
          fi

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    outputs:
      cert_sha256: ${{ steps.sign.outputs.cert_sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned

      - name: Sign and verify APK
        id: sign
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing setting $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          "$apksigner" sign --alignment-preserved \
            --ks "$keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "Gripmaxxer-$TAG.apk" app-release-unsigned.apk
          certs="$("$apksigner" verify --print-certs "Gripmaxxer-$TAG.apk")"
          cert_sha256="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$certs" | head -n1)"
          if [[ "${cert_sha256,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo "::error::APK signer does not match the pinned release certificate"
            exit 1
          fi
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Gripmaxxer-${{ env.TAG }}
          path: Gripmaxxer-${{ env.TAG }}.apk
          if-no-files-found: error

  # Confirm the signed APK matches an independent build before publishing.
  verify:
    needs: sign
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set version for manual release
        if: github.event_name == 'workflow_dispatch'
        run: git tag "$TAG"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build unsigned APK
        run: ./gradlew --no-daemon :app:assembleRelease --no-build-cache

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Gripmaxxer-${{ env.TAG }}

      - name: Compare with signed APK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apksigcopier
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          PATH="${apksigner%/*}:$PATH"
          apksigcopier compare "Gripmaxxer-$TAG.apk" --unsigned app/build/outputs/apk/release/app-release-unsigned.apk

  publish:
    needs: [sign, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Gripmaxxer-${{ env.TAG }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ needs.sign.outputs.cert_sha256 }}
        run: |
          notes="Signing certificate SHA-256: \`$CERT_SHA256\`"
          if [[ "$TAG" == "v0.2.1" ]]; then
            notes+=$'\n\nThis release switches from the old debug signing key to a permanent release key. Existing v0.2.0 installs need a one-time reinstall, which removes local workout history. Future releases update normally.'
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "Gripmaxxer $TAG" --notes "$notes" --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "Gripmaxxer-$TAG.apk" "${args[@]}"
